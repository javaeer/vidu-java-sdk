name: 💡 功能建议 / Feature Request
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与问题 / Problem
      description: 这个功能解决了什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 期望的 API 形态或行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 考虑过的其他方案
  - type: textarea
    id: context
    attributes:
      label: 补充上下文 / Additional context
